user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/nginx_error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/nginx_access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    # 该指令设置请求头（request header）的读超时时间，超时后，nginx返回HTTP状态码408(“Request timed out”)
    # 默认是60s
    client_header_timeout 15;

    # 该指令设置请求体（request body）的读超时时间，超时后，nginx返回HTTP状态码408(“Request timed out”)
    # 默认是60s
    client_body_timeout 15;

    # 服务端向客户端传输数据的超时时间
    send_timeout 10;

    # 默认是75s
    keepalive_timeout  65;

    #gzip  on;

    # 隐藏版本号
    server_tokens off;

    # 文件目录访问控制
    autoindex off;

    # the number of connections from a single IP address
    # 定义一个zone，限制每个IP的连接数
    # limit_conn_zone $binary_remote_addr zone=addr:10m;
    # 设置一个值。
    # limit_conn addr 5;

    # 添加一个默认server，当host头被修改匹配不到server时会跳到该默认server，该默认server直接返回403错误。
    server {
        listen 8888 default;
        server_name _;
        location / {
            return 403;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
